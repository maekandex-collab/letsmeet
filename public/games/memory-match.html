<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>🧠 Memory Match – 10s Challenge</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        body {
            background: #0a0a12;
            background: radial-gradient(ellipse at center, #1a1a2e, #0a0a12);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', system-ui, sans-serif;
            overflow: hidden;
        }
        #game {
            position: relative;
            width: 100%;
            max-width: 420px;
            height: 100vh;
            max-height: 780px;
            background: linear-gradient(180deg, #0f0f1a, #06060c);
            border-radius: 32px;
            overflow: hidden;
            box-shadow: 0 20px 80px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(100, 200, 255, 0.06);
            margin: 12px;
            display: flex;
            flex-direction: column;
        }
        @media (max-width:440px) {
            #game {
                max-height: 100vh;
                border-radius: 0;
                margin: 0;
                max-width: 100%;
            }
        }

        #top-bar {
            padding: 14px 20px 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            z-index: 10;
            background: transparent;
            pointer-events: none;
        }
        #top-bar>* {
            pointer-events: auto;
        }
        .logo {
            font-size: 20px;
            font-weight: 800;
            background: linear-gradient(135deg, #f5c542, #ff6b9d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .stats {
            display: flex;
            gap: 16px;
            font-size: 15px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.7);
        }
        .stats span {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .stats .num {
            color: #fff;
            min-width: 20px;
            text-align: center;
        }
        .stats .num.timer-num {
            color: #4dc9f6;
            font-weight: 800;
            font-size: 18px;
            min-width: 30px;
        }
        .stats .num.timer-num.warning {
            color: #ff4757;
            animation: pulse 0.5s ease infinite alternate;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            100% { opacity: 0.4; }
        }

        #canvas-wrap {
            flex: 1;
            position: relative;
            overflow: hidden;
            margin: 0 8px 8px;
            border-radius: 24px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.03);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 12px;
        }

        /* Grid */
        #grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            width: 100%;
            max-width: 340px;
            aspect-ratio: 1 / 1;
            margin: 0 auto;
        }
        .card {
            position: relative;
            aspect-ratio: 1 / 1;
            perspective: 600px;
            cursor: pointer;
            touch-action: manipulation;
        }
        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-style: preserve-3d;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
        }
        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }
        .card.matched .card-inner {
            transform: rotateY(180deg);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.2);
        }
        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .card-back {
            background: linear-gradient(145deg, #2a2a3e, #1a1a2e);
            border: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 28px;
            color: rgba(255, 255, 255, 0.15);
        }
        .card-front {
            transform: rotateY(180deg);
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 42px;
        }
        .card.matched .card-front {
            background: rgba(255, 215, 0, 0.08);
            border-color: rgba(255, 215, 0, 0.15);
        }
        .card.disabled {
            pointer-events: none;
            opacity: 0.6;
        }

        #game-info {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 340px;
            margin-bottom: 12px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
            font-weight: 500;
        }
        #game-info span {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        #game-info .val {
            color: #fff;
            font-weight: 700;
        }
        #game-info .val.matches {
            color: #f5c542;
        }

        /* Overlay */
        .overlay {
            position: absolute;
            inset: 0;
            z-index: 30;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            flex-direction: column;
            border-radius: 24px;
            animation: fadeIn 0.4s ease;
        }
        .overlay.active {
            display: flex;
        }
        @keyframes fadeIn {
            0% { opacity: 0; transform: scale(0.95); }
            100% { opacity: 1; transform: scale(1); }
        }

        .overlay-box {
            text-align: center;
            padding: 28px 24px 32px;
            max-width: 300px;
            width: 85%;
            background: rgba(20, 20, 40, 0.85);
            border-radius: 28px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 16px 60px rgba(0, 0, 0, 0.5);
        }
        .overlay-box .emoji-big {
            font-size: 64px;
            display: block;
            margin-bottom: 6px;
        }
        .overlay-box h2 {
            font-size: 30px;
            font-weight: 800;
            color: #fff;
            margin-bottom: 2px;
        }
        .overlay-box .sub {
            color: rgba(255, 255, 255, 0.4);
            font-size: 15px;
            margin-bottom: 16px;
        }
        .overlay-box .btn-main {
            padding: 14px 44px;
            border: none;
            border-radius: 30px;
            font-size: 17px;
            font-weight: 700;
            background: linear-gradient(135deg, #f5c542, #ff6b9d);
            color: #fff;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 6px 30px rgba(255, 107, 157, 0.2);
            touch-action: manipulation;
        }
        .overlay-box .btn-main:active {
            transform: scale(0.92);
        }
        .overlay-box .final-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin: 12px 0 20px;
        }
        .overlay-box .final-stat {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 14px;
            padding: 8px 4px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .overlay-box .final-stat .val {
            font-size: 26px;
            font-weight: 800;
            color: #fff;
            display: block;
        }
        .overlay-box .final-stat .label {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.35);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }
        .overlay-box .final-stat .val.high-score {
            color: #f5c542;
        }

        #particles {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 20;
            overflow: hidden;
            border-radius: 24px;
        }
        .particle {
            position: absolute;
            font-size: 20px;
            animation: floatUp 1.2s ease-out forwards;
            opacity: 0;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translate(0, 0) scale(0.5) rotate(0deg); }
            100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(1.4) rotate(360deg); }
        }

        @media(max-height:700px) {
            .logo { font-size: 16px; }
            .stats { font-size: 13px; gap: 12px; }
            .overlay-box h2 { font-size: 24px; }
            .overlay-box .emoji-big { font-size: 48px; }
            .overlay-box .btn-main { padding: 12px 32px; font-size: 15px; }
            .card-face { font-size: 28px; }
            .card-front { font-size: 34px; }
            #grid { gap: 8px; max-width: 280px; }
            #game-info { font-size: 12px; margin-bottom: 8px; }
        }
        @media(max-height:600px) {
            #top-bar { padding: 8px 16px 4px; }
            .logo { font-size: 14px; }
            .stats { font-size: 12px; gap: 10px; }
            .overlay-box { padding: 20px 16px 24px; }
            #grid { gap: 6px; max-width: 240px; }
            .card-face { font-size: 22px; }
            .card-front { font-size: 28px; }
        }
    </style>
</head>
<body>
    <div id="game">
        <!-- Top bar -->
        <div id="top-bar">
            <div class="logo">🧠 10s Memory</div>
            <div class="stats">
                <span>⏱️ <span class="num timer-num" id="timerDisplay">10</span></span>
                <span>🏆 <span class="num" id="scoreDisplay">0</span></span>
            </div>
        </div>

        <!-- Canvas Wrap -->
        <div id="canvas-wrap">
            <!-- Game info -->
            <div id="game-info">
                <span>👆 Pairs: <span class="val matches" id="matchesDisplay">0</span>/8</span>
                <span>⭐ Best: <span class="val" id="highDisplay">0</span></span>
            </div>

            <!-- Grid -->
            <div id="grid"></div>

            <!-- Particles -->
            <div id="particles"></div>

            <!-- Start overlay -->
            <div class="overlay active" id="startOverlay">
                <div class="overlay-box">
                    <span class="emoji-big">⏱️</span>
                    <h2>10s Memory Match</h2>
                    <p class="sub">Find a matching pair before time runs out!<br/>Each match <strong>resets</strong> the timer to 10s.</p>
                    <button class="btn-main" id="startBtn" onclick="startGame()">▶ Play</button>
                </div>
            </div>

            <!-- Game Over overlay -->
            <div class="overlay" id="gameoverOverlay">
                <div class="overlay-box">
                    <span class="emoji-big" id="goEmoji">⏰</span>
                    <h2 id="goTitle">Time's Up!</h2>
                    <p class="sub" id="goSub">You didn't match in time.</p>
                    <div class="final-stats">
                        <div class="final-stat">
                            <span class="val" id="finalMatches">0</span>
                            <span class="label">Pairs</span>
                        </div>
                        <div class="final-stat">
                            <span class="val high-score" id="finalHigh">0</span>
                            <span class="label">Best</span>
                        </div>
                    </div>
                    <button class="btn-main" id="restartBtn" onclick="startGame()">🔄 Try Again</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  CONFIG
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        const EMOJIS = ['🍎', '🍌', '🍇', '🍉', '🍓', '🍑', '🍒', '🥝'];
        const TOTAL_PAIRS = EMOJIS.length;
        const TIMER_SECONDS = 10;

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  AUDIO (Web Audio)
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                try {
                    audioCtx = new(window.AudioContext || window.webkitAudioContext)();
                } catch (_) {}
            }
        }

        function playTone(freq, duration, type = 'sine', vol = 0.10) {
            try {
                if (!audioCtx) initAudio();
                if (!audioCtx) return;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(vol, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (_) {}
        }

        function playFlip() {
            playTone(400, 0.06, 'sine', 0.05);
        }

        function playMatch() {
            playTone(523, 0.10, 'sine', 0.08);
            setTimeout(() => playTone(659, 0.10, 'sine', 0.08), 100);
            setTimeout(() => playTone(784, 0.15, 'sine', 0.10), 200);
        }

        function playFail() {
            playTone(300, 0.15, 'sawtooth', 0.04);
        }

        function playTick() {
            playTone(800, 0.04, 'sine', 0.04);
        }

        function playTimeout() {
            playTone(440, 0.15, 'sine', 0.08);
            setTimeout(() => playTone(330, 0.20, 'sine', 0.08), 150);
            setTimeout(() => playTone(220, 0.30, 'sine', 0.08), 300);
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  GAME STATE
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        const state = {
            cards: [],
            flipped: [],
            matched: [],
            matches: 0,
            score: 0,
            highScore: parseInt(localStorage.getItem('memory10sHigh')) || 0,
            timer: TIMER_SECONDS,
            timerInterval: null,
            isRunning: false,
            isGameOver: false,
            isProcessing: false,
            lockBoard: false, // prevent multiple clicks while animating
        };

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  DOM REFS
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        const grid = document.getElementById('grid');
        const timerDisplay = document.getElementById('timerDisplay');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const highDisplay = document.getElementById('highDisplay');
        const matchesDisplay = document.getElementById('matchesDisplay');
        const startOverlay = document.getElementById('startOverlay');
        const gameoverOverlay = document.getElementById('gameoverOverlay');
        const finalMatches = document.getElementById('finalMatches');
        const finalHigh = document.getElementById('finalHigh');
        const goEmoji = document.getElementById('goEmoji');
        const goTitle = document.getElementById('goTitle');
        const goSub = document.getElementById('goSub');
        const particleContainer = document.getElementById('particles');

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  PARTICLES
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        function spawnParticles(emoji, x, y, count = 12) {
            const rect = grid.getBoundingClientRect();
            const cx = x;
            const cy = y;
            for (let i = 0; i < count; i++) {
                const el = document.createElement('div');
                el.className = 'particle';
                el.textContent = emoji;
                const angle = Math.random() * Math.PI * 2;
                const dist = 30 + Math.random() * 60;
                const tx = Math.cos(angle) * dist;
                const ty = Math.sin(angle) * dist - 30;
                el.style.setProperty('--tx', tx + 'px');
                el.style.setProperty('--ty', ty + 'px');
                el.style.left = (cx + (Math.random() - 0.5) * 20) + 'px';
                el.style.top = (cy + (Math.random() - 0.5) * 20) + 'px';
                el.style.fontSize = (14 + Math.random() * 22) + 'px';
                el.style.animationDuration = (0.8 + Math.random() * 0.6) + 's';
                el.style.animationDelay = (Math.random() * 0.2) + 's';
                particleContainer.appendChild(el);
                setTimeout(() => el.remove(), 1500);
            }
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  GRID SETUP
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function buildGrid() {
            let deck = [];
            EMOJIS.forEach((emoji, idx) => {
                deck.push({ id: idx, emoji: emoji, matched: false });
                deck.push({ id: idx, emoji: emoji, matched: false });
            });
            deck = shuffleArray(deck);
            state.cards = deck.map((item, index) => ({
                ...item,
                index: index,
                flipped: false,
                matched: false,
            }));
            state.flipped = [];
            state.matched = [];
            state.matches = 0;
            state.score = 0;
            state.timer = TIMER_SECONDS;
            state.isGameOver = false;
            state.isProcessing = false;
            state.lockBoard = false;
            if (state.timerInterval) {
                clearInterval(state.timerInterval);
                state.timerInterval = null;
            }
            renderGrid();
            updateUI();
            timerDisplay.classList.remove('warning');
        }

        function renderGrid() {
            grid.innerHTML = '';
            state.cards.forEach((card, index) => {
                const cardDiv = document.createElement('div');
                cardDiv.className = 'card';
                cardDiv.dataset.index = index;
                cardDiv.innerHTML = `
                    <div class="card-inner">
                        <div class="card-face card-back">❓</div>
                        <div class="card-face card-front">${card.emoji}</div>
                    </div>
                `;
                if (card.matched) {
                    cardDiv.classList.add('matched');
                    cardDiv.classList.add('disabled');
                }
                cardDiv.addEventListener('click', () => handleCardClick(index));
                cardDiv.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    handleCardClick(index);
                }, { passive: false });
                grid.appendChild(cardDiv);
            });
        }

        function updateUI() {
            scoreDisplay.textContent = state.score;
            highDisplay.textContent = state.highScore;
            matchesDisplay.textContent = state.matches;
            timerDisplay.textContent = Math.ceil(state.timer);
            if (state.timer <= 3) {
                timerDisplay.classList.add('warning');
            } else {
                timerDisplay.classList.remove('warning');
            }
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  GAME LOGIC
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        function startGame() {
            buildGrid();
            state.isRunning = true;
            state.isGameOver = false;
            startOverlay.classList.remove('active');
            gameoverOverlay.classList.remove('active');
            updateUI();
            initAudio();
            // Start timer
            state.timer = TIMER_SECONDS;
            if (state.timerInterval) clearInterval(state.timerInterval);
            state.timerInterval = setInterval(() => {
                state.timer -= 0.1;
                if (state.timer < 0) state.timer = 0;
                updateUI();
                if (state.timer <= 0) {
                    clearInterval(state.timerInterval);
                    state.timerInterval = null;
                    // Time's up!
                    if (!state.isGameOver) {
                        timeoutGame();
                    }
                }
            }, 100);
        }

        function resetTimer() {
            state.timer = TIMER_SECONDS;
            updateUI();
            // Timer is already running, just reset the value
        }

        function handleCardClick(index) {
            if (!state.isRunning || state.isGameOver) return;
            if (state.isProcessing || state.lockBoard) return;

            const card = state.cards[index];
            if (card.matched || card.flipped) return;
            if (state.flipped.length >= 2) return;

            // Flip the card
            card.flipped = true;
            const cardEl = grid.querySelector(`.card[data-index="${index}"]`);
            if (cardEl) cardEl.classList.add('flipped');
            playFlip();
            state.flipped.push(index);

            if (state.flipped.length === 2) {
                state.isProcessing = true;
                const idx1 = state.flipped[0];
                const idx2 = state.flipped[1];
                const card1 = state.cards[idx1];
                const card2 = state.cards[idx2];

                if (card1.id === card2.id) {
                    // Match!
                    card1.matched = true;
                    card2.matched = true;
                    state.matches++;
                    state.score += 10 + Math.floor(Math.random() * 5);
                    state.matched.push(idx1, idx2);
                    playMatch();
                    const el1 = grid.querySelector(`.card[data-index="${idx1}"]`);
                    const el2 = grid.querySelector(`.card[data-index="${idx2}"]`);
                    if (el1) { el1.classList.add('matched');
                        el1.classList.add('disabled'); }
                    if (el2) { el2.classList.add('matched');
                        el2.classList.add('disabled'); }
                    spawnParticles('✨', 0, 0, 10);
                    state.flipped = [];
                    state.isProcessing = false;
                    // Reset timer on match!
                    resetTimer();
                    updateUI();
                    if (state.matches === TOTAL_PAIRS) {
                        winGame();
                    }
                } else {
                    // No match
                    playFail();
                    state.lockBoard = true;
                    setTimeout(() => {
                        card1.flipped = false;
                        card2.flipped = false;
                        const el1 = grid.querySelector(`.card[data-index="${idx1}"]`);
                        const el2 = grid.querySelector(`.card[data-index="${idx2}"]`);
                        if (el1) el1.classList.remove('flipped');
                        if (el2) el2.classList.remove('flipped');
                        state.flipped = [];
                        state.isProcessing = false;
                        state.lockBoard = false;
                    }, 500);
                }
                updateUI();
            } else {
                // Only one card flipped so far
                // We still need to check if timer is running, but nothing else
            }
        }

        function timeoutGame() {
            state.isRunning = false;
            state.isGameOver = true;
            playTimeout();
            goEmoji.textContent = '⏰';
            goTitle.textContent = 'Time\'s Up!';
            goSub.textContent = `You matched ${state.matches} out of ${TOTAL_PAIRS} pairs.`;
            finalMatches.textContent = state.matches;
            finalHigh.textContent = state.highScore;
            gameoverOverlay.classList.add('active');
            try {
                if (window.parent && window.parent !== window) {
                    window.parent.postMessage({
                        source: 'lm-game',
                        slug: 'memory-match',
                        score: state.score,
                        highScore: state.highScore
                    }, window.location.origin);
                }
            } catch (e) {}
        }

        function winGame() {
            state.isRunning = false;
            state.isGameOver = true;
            if (state.score > state.highScore) {
                state.highScore = state.score;
                localStorage.setItem('memory10sHigh', String(state.highScore));
            }
            if (state.timerInterval) {
                clearInterval(state.timerInterval);
                state.timerInterval = null;
            }
            playMatch();
            setTimeout(() => {
                spawnParticles('🎉', 0, 0, 30);
            }, 300);
            goEmoji.textContent = '🏆';
            goTitle.textContent = 'You Win!';
            goSub.textContent = `All ${TOTAL_PAIRS} pairs matched!`;
            finalMatches.textContent = state.matches;
            finalHigh.textContent = state.highScore;
            gameoverOverlay.classList.add('active');
            try {
                if (window.parent && window.parent !== window) {
                    window.parent.postMessage({
                        source: 'lm-game',
                        slug: 'memory-match',
                        score: state.score,
                        highScore: state.highScore
                    }, window.location.origin);
                }
            } catch (e) {}
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  KEYBOARD SHORTCUTS
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        document.addEventListener('keydown', (e) => {
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                if (!state.isRunning && !state.isGameOver) {
                    startGame();
                }
            }
            if (e.key === 'Enter') {
                if (gameoverOverlay.classList.contains('active')) {
                    startGame();
                }
            }
        });

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  PARTICLE STYLE INJECTION
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        const style = document.createElement('style');
        style.textContent = `
            .particle {
                position: absolute;
                pointer-events: none;
                z-index: 20;
                animation: floatUp 1.2s ease-out forwards;
                opacity: 0;
            }
            @keyframes floatUp {
                0% { opacity: 1; transform: translate(0, 0) scale(0.5) rotate(0deg); }
                100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(1.4) rotate(360deg); }
            }
        `;
        document.head.appendChild(style);

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  INIT
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        buildGrid();
        highDisplay.textContent = state.highScore;

        console.log('🧠 10s Memory Match loaded! Find a pair before time runs out.');
        console.log('💡 Each match resets the timer to 10 seconds.');
        console.log('⌨️  Space to start, Enter to restart.');
    </script>
</body>
</html>
